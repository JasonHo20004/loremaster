apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loremaster-local
  namespace: argocd
spec:
  project: loremaster-local
  source:
    repoURL: git://git-source.argocd.svc.cluster.local:9418/repository.git
    targetRevision: main
    path: deploy/helm/loremaster
    helm:
      releaseName: loremaster
      valueFiles:
        - ../../environments/local/images.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: loremaster
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      - FailOnSharedResource=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
