# S10 local log store: Loki single binary on an emptyDir, 72 h retention.
# Logs are lab evidence, not records; PostgreSQL remains the source of truth.
fullnameOverride: loki
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: '2026-01-01'
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: loki_index_, period: 24h }
  limits_config:
    retention_period: 72h
    max_label_names_per_series: 12
    # Alloy replays each container's existing log on first start.
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  ui:
    enabled: false

singleBinary:
  replicas: 1
  persistence: { enabled: false }
  extraVolumes:
    - name: data
      emptyDir: { sizeLimit: 2Gi }
  extraVolumeMounts:
    - { name: data, mountPath: /var/loki }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: '1', memory: 512Mi }

backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
gateway: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
minio: { enabled: false }
sidecar:
  rules: { enabled: false }
