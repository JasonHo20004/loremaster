name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm run verify

      - name: Verify server-only S7 contracts
        run: pnpm test:s7:contracts

      - name: Verify S8 image and build-context policy
        run: pnpm test:s8:image-policy

      - name: Verify S8 file secrets and local edge contract
        run: |
          pnpm test:s8:secrets
          pnpm test:s8:proxy-contract

      - name: Install hash-pinned S9 local tools
        run: pnpm s9 tools

      - name: Verify S9 Helm and Kubernetes policy
        run: pnpm test:s9

      - name: Install Chromium for accessibility checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify web accessibility and responsive shell
        run: pnpm --filter @loremaster/web test:e2e

      - name: Verify clean PostgreSQL migrations and constraints
        run: pnpm test:database

      - name: Verify composed API against PostgreSQL
        run: pnpm test:api:database

      - name: Verify Redis ACLs, queue worker, and shared limiter
        run: pnpm test:s7:redis

      - name: Verify composed S7 failure and security gate
        run: pnpm test:s7:integration

  image-validation:
    name: S8 image validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for gateway journey
        run: pnpm exec playwright install --with-deps chromium

      - name: Configure pinned BuildKit builder
        run: |
          docker buildx create \
            --name loremaster-s8-ci \
            --driver docker-container \
            --driver-opt image=moby/buildkit:v0.25.1@sha256:79cc6476ab1a3371c9afd8b44e7c55610057c43e18d9b39b68e2b0c2475cc1b6 \
            --use
          docker buildx inspect --bootstrap

      - name: Build and verify S8 images
        run: pnpm test:images

      - name: Verify musl remediation in applications and data services
        run: pnpm test:s9:musl

      - name: Verify clean-volume Compose and dependency lifecycle
        run: |
          pnpm test:s8:data-services
          pnpm test:s8:compose
          pnpm test:s8:lifecycle

      - name: Verify packaged browser journeys and T25
        run: pnpm test:s8:e2e

      - name: Preserve S8 acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s8-acceptance-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            .cache/s8-build-results.json
            .cache/s8-reproducibility.json
            .cache/s8-evidence/summary.json
            .cache/s8-evidence/*-scan.json
            .cache/s8-evidence/*-sbom.cdx.json
            .cache/s8-evidence/*-files.txt
            .cache/s8-lifecycle.json
            .cache/s8-worker-drain.json
            .cache/s8-e2e.json
            .cache/s8-t25.json
            .cache/s9/musl.json

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install

      - name: Audit locked dependencies
        run: pnpm audit --audit-level moderate

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
