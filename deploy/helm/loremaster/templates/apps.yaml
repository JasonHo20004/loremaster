{{- range $name, $component := .Values.components }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: { app.kubernetes.io/name: {{ $name }} }
spec:
  replicas: {{ $component.replicas }}
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 180
  {{- if eq $name "web" }}
  strategy: { type: Recreate }
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  {{- end }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ $name }} }
      {{- if eq $name "web" }}
      annotations:
        cni.projectcalico.org/ipAddrs: {{ list $.Values.gatewayIP | toJson | quote }}
      {{- end }}
    spec:
      runtimeClassName: loremaster
      automountServiceAccountToken: false
      serviceAccountName: runtime
      terminationGracePeriodSeconds: {{ $component.grace }}
      securityContext:
        {{- include "loremaster.podSecurity" $component.uid | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: {{ include "loremaster.image" (dict "name" $name "image" (index $.Values.images $name)) }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "loremaster.security" . | nindent 12 }}
          ports: [{ name: http, containerPort: {{ $component.port }} }]
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: {{ $component.cpu | quote }}, memory: {{ $component.memory }} }
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 3
            timeoutSeconds: 2
          env:
            {{- if eq $name "api" }}
            - name: LOREMASTER_API_TRUSTED_PROXIES
              value: {{ printf "%s/32" $.Values.gatewayIP | quote }}
            {{- end }}
            {{- range $key, $value := $component.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $key, $file := $component.files }}
            - name: {{ $key }}
              value: /run/secrets/{{ $file }}
            {{- end }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- range $key, $file := $component.files }}
            - { name: credentials, mountPath: /run/secrets/{{ $file }}, subPath: {{ $file }}, readOnly: true }
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 32Mi }
        {{- if $component.files }}
        - name: credentials
          secret: { secretName: {{ $name }}-credentials, defaultMode: 292 }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: {{ $name }} }
  ports: [{ name: http, port: {{ $component.port }}, targetPort: http }]
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runtime
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: api }
