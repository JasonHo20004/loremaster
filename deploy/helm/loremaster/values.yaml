# Filled by the admission/promotion command; no mutable application tags.
images:
  api: ''
  worker: ''
  observer: ''
  web: ''
  migration: ''
  importer: ''
postgresImage: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
