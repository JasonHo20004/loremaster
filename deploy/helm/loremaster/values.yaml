      LOREMASTER_WORKER_DATABASE_URL_FILE: worker_database_url
      LOREMASTER_WORKER_REDIS_URL_FILE: redis_worker_url
      LOREMASTER_WORKER_CACHE_REDIS_URL_FILE: redis_worker_cache_url
  observer:
    uid: 10004
    port: 3002
    replicas: 1
    grace: 15
    cpu: '0.5'
    memory: 128Mi
