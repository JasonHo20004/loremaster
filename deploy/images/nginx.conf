pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 16k;
  client_body_timeout 5s;
  client_header_timeout 5s;
  send_timeout 10s;
  keepalive_timeout 5s;
  map $uri $static_cache {
    default "no-cache";
    ~^/api/ "";
    ~^/assets/ "public, max-age=31536000, immutable";
  }
  server {
    listen 8080;
    root /srv/web;
    autoindex off;
    add_header Cache-Control $static_cache;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location = /health/live { default_type application/json; return 200 '{"status":"ok"}'; }
    location = /health/ready { default_type application/json; return 200 '{"status":"ready"}'; }
    location = /api { return 404; }
    location ^~ /api/ {
      proxy_pass http://api:3000;
      proxy_http_version 1.1;
      proxy_pass_request_headers off;
      proxy_set_header Host $http_host;
      proxy_set_header Origin $http_origin;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Content-Type $http_content_type;
      proxy_set_header Accept $http_accept;
      proxy_set_header User-Agent $http_user_agent;
      proxy_set_header Idempotency-Key $http_idempotency_key;
      proxy_set_header X-CSRF-Token $http_x_csrf_token;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Connection "";
      proxy_connect_timeout 1s;
      proxy_read_timeout 10s;
      proxy_send_timeout 10s;
      proxy_buffering off;
      proxy_cache off;
      proxy_intercept_errors off;
    }
    location ~ (^|/)\. { return 404; }
    location ^~ /health/ { return 404; }
    location = /index.html { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location ~ \.[A-Za-z0-9]+$ { try_files $uri =404; }
    location / { try_files $uri /index.html; }
  }
}
